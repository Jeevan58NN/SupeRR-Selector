[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superr-selector"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4.0","numpy>=1.26,<3.0","fastapi>=0.115,<1.0","uvicorn[standard]>=0.30,<1.0","pydantic>=2.8,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
